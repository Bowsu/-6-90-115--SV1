        // 洗牌演算法 (Fisher-Yates)
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

                feedbackBox.classList.remove('hidden');
                if (userSelected === q.answer) {
                    feedbackBox.className = "p-4 rounded-xl text-sm md:text-base bg-emerald-100 text-emerald-900 border border-emerald-300";
                    feedbackBox.innerHTML = `✅ <strong>回答正確！</strong><br><span class="mt-1 block text-slate-700">📖 <strong>詳解：</strong>${q.explanation} (課本第 ${q.page} 頁)</span>`;
                } else {
                    feedbackBox.className = "p-4 rounded-xl text-sm md:text-base bg-rose-100 text-rose-900 border border-rose-300";
                    feedbackBox.innerHTML = `❌ <strong>回答錯誤！</strong> 正確答案是 <span class="font-bold underline">${q.answer}</span>。<br><span class="mt-1 block text-slate-700">📖 <strong>詳解：</strong>${q.explanation} (課本第 ${q.page} 頁)</span>`;
                }
            } else {
                feedbackBox.classList.add('hidden');
                feedbackBox.innerHTML = '';
            }

            // 按鈕狀態控制
            document.getElementById('prev-btn').disabled = currentIndex === 0;
            const nextBtn = document.getElementById('next-btn');
            if (currentIndex === total - 1) {
                nextBtn.innerText = "📊 結束測驗看成績";
                nextBtn.className = "bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 px-6 rounded-xl shadow-sm transition";
            } else {
                nextBtn.innerText = "下一題 ➡️";
                nextBtn.className = "bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-6 rounded-xl shadow-sm transition";
            }
        }

        // 使用者選擇答案
        function selectAnswer(optionKey) {
            userAnswers[currentIndex] = optionKey;
            renderQuestion();
        }

        // 即時計算目前得分
        function updateLiveScore() {
            let correctCount = 0;
            for (let idx in userAnswers) {
                if (userAnswers[idx] === currentQuizQuestions[idx].answer) {
                    correctCount++;
                }
            }
            let currentScore = Math.round(correctCount * scorePerQuestion);
            document.getElementById('score-indicator').innerText = `目前得分：${currentScore} 分`;
        }

        // 上一題
        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        // 下一題或交卷
        function nextQuestion() {
            if (currentIndex < currentQuizQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                finishQuiz();
            }
        }

        // 結束測驗並結算
        function finishQuiz() {
            let correctCount = 0;
            let wrongItems = [];

            currentQuizQuestions.forEach((q, idx) => {
                const uAns = userAnswers[idx];
                if (uAns === q.answer) {
                    correctCount++;
                } else {
                    wrongItems.push({
                        no: idx + 1,
                        question: q.question,
                        options: q.options,
                        userAnswer: uAns || "未作答",
                        correctAnswer: q.answer,
                        explanation: q.explanation,
                        page: q.page
                    });
                }
            });

            let finalScore = Math.round(correctCount * scorePerQuestion);

            // 切換畫面
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            // 顯示總分與統計
            document.getElementById('final-score-display').innerText = `${finalScore} 分`;
            document.getElementById('final-stats-text').innerText = `共 ${currentQuizQuestions.length} 題，答對 ${correctCount} 題，答錯 ${currentQuizQuestions.length - correctCount} 題`;

            // 渲染錯題大鍋菜
            const wrongListContainer = document.getElementById('wrong-list');
            wrongListContainer.innerHTML = '';

            if (wrongItems.length === 0) {
                wrongListContainer.innerHTML = `<div class="p-6 bg-emerald-50 text-emerald-800 rounded-xl text-center font-medium">太厲害了！全部答對，沒有錯題！🎉</div>`;
            } else {
                wrongItems.forEach(item => {
                    let card = document.createElement('div');
                    card.className = "p-4 rounded-xl border border-rose-200 bg-rose-50/40 space-y-2 text-sm md:text-base";
                    
                    let optionsHtml = '';
                    for(let k in item.options) {
                        let isCorrect = k === item.correctAnswer;
                        let isUserWrong = k === item.userAnswer;
                        let style = "block p-1 rounded ";
                        if(isCorrect) style += "bg-emerald-100 text-emerald-800 font-bold";
                        else if(isUserWrong) style += "bg-rose-100 text-rose-800 line-through";
                        optionsHtml += `<div class="${style}">${k}. ${item.options[k]}</div>`;
                    }

                    card.innerHTML = `
                        <div class="font-bold text-slate-800">第 ${item.no} 題：${item.question}</div>
                        <div class="space-y-1 my-2">${optionsHtml}</div>
                        <div class="text-xs md:text-sm text-slate-600 bg-white p-3 rounded-lg border border-slate-200 space-y-1">
                            <div>您的作答：<span class="font-bold text-rose-600">${item.userAnswer}</span> ｜ 正確答案：<span class="font-bold text-emerald-600">${item.correctAnswer}</span></div>
                            <div class="text-slate-700 mt-1">📖 <strong>詳解：</strong>${item.explanation} (課本第 ${item.page} 頁)</div>
                        </div>
                    `;
                    wrongListContainer.appendChild(card);
                });
            }
        }

        // 重新測驗
        function resetQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
